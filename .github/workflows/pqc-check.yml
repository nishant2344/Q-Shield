name: Q-Shield PQC Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pqc-audit:
    name: AST Quantum-Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Q-Shield PQC AST Gate
        run: python scanner/ast_auditor.py . --fail-on-high